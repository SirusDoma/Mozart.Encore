name: Draft Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name'
        required: true
        type: string
      bump_version:
        description: 'Update and commit all server versions from the release tag'
        default: true
        type: boolean
      mozart:
        description: 'Mozart.Encore — v3.10 (O2Jam Original)'
        default: true
        type: boolean
      amadeus:
        description: 'Amadeus.Encore — v3.82 (O2Jam NX)'
        default: true
        type: boolean
      crosstime:
        description: 'CrossTime.Encore — v2.33 (O2Jam X2)'
        default: true
        type: boolean
      identity:
        description: 'Identity.Encore — v5.89 (O2JamO2 Beta)'
        default: true
        type: boolean
      identityp2:
        description: 'IdentityP2.Encore — v5.89 (O2JamO2 Final)'
        default: true
        type: boolean
      memoryer:
        description: 'Memoryer.Encore — v8.02 (O2Jam Classic)'
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        name: Build server matrix
        run: |
          SELECTED=()
          [ "${{ inputs.mozart }}"     = "true" ] && SELECTED+=("Mozart")
          [ "${{ inputs.amadeus }}"    = "true" ] && SELECTED+=("Amadeus")
          [ "${{ inputs.crosstime }}"  = "true" ] && SELECTED+=("CrossTime")
          [ "${{ inputs.identity }}"   = "true" ] && SELECTED+=("Identity")
          [ "${{ inputs.identityp2 }}" = "true" ] && SELECTED+=("IdentityP2")
          [ "${{ inputs.memoryer }}"   = "true" ] && SELECTED+=("Memoryer")

          if [ ${#SELECTED[@]} -eq 0 ]; then
            echo "::error::No server build selected"
            exit 1
          fi

          echo "Selected: ${SELECTED[*]}"
          SERVERS=$(printf '"%s",' "${SELECTED[@]}")
          SERVERS="[${SERVERS%,}]"

          # Each rid runs on its matching host OS so the published binary can be
          # executed later (to resolve the per-server Version via `<exe> version`).
          INCLUDE='[{"rid":"win-x86","os":"windows-latest"},{"rid":"linux-x64","os":"ubuntu-latest"}]'
          echo "matrix={\"server\":$SERVERS,\"rid\":[\"win-x86\",\"linux-x64\"],\"include\":$INCLUDE}" >> "$GITHUB_OUTPUT"

  bump_version:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Bump server versions
        shell: bash
        env:
          ENABLED: ${{ inputs.bump_version }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$ENABLED" != "true" ]]; then
            echo "Version bump disabled"
            exit 0
          fi

          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::warning::Tag '$TAG' is not a valid System.Version; skipping version bump"
            exit 0
          fi

          IFS='.' read -ra COMPONENTS <<< "$VERSION"
          NORMALIZED=()
          for COMPONENT in "${COMPONENTS[@]}"; do
            COMPONENT="${COMPONENT#"${COMPONENT%%[!0]*}"}"
            COMPONENT="${COMPONENT:-0}"
            if (( ${#COMPONENT} > 10 )) || \
               { (( ${#COMPONENT} == 10 )) && [[ "$COMPONENT" > "2147483647" ]]; }; then
              echo "::warning::Tag '$TAG' is not a valid System.Version; skipping version bump"
              exit 0
            fi
            NORMALIZED+=("$COMPONENT")
          done

          printf -v VERSION '%s.' "${NORMALIZED[@]}"
          VERSION="${VERSION%.}"
          printf -v ARGUMENTS '%s, ' "${NORMALIZED[@]}"
          ARGUMENTS="${ARGUMENTS%, }"

          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            echo "::error::Version bumps must be dispatched from a branch"
            exit 1
          fi

          PATHS=(
            'Source/Mozart/Mozart/Program.cs'
            'Source/Amadeus/Amadeus/Program.cs'
            'Source/CrossTime/CrossTime/Program.cs'
            'Source/Identity/Identity/Program.cs'
            'Source/IdentityP2/IdentityP2/Program.cs'
            'Source/Memoryer/Memoryer/Program.cs'
          )

          PATTERN='^[[:space:]]*public static Version Version[[:space:]]*=>[[:space:]]*new\([^)]*\);[[:space:]]*$'
          for FILE in "${PATHS[@]}"; do
            MATCHES=$(grep -Ec "$PATTERN" "$FILE" || true)
            if [[ "$MATCHES" -ne 1 ]]; then
              echo "::error::Expected one Program.Version declaration in '$FILE'"
              exit 1
            fi

            sed -E -i "s|^([[:space:]]*public static Version Version[[:space:]]*=>[[:space:]]*new\\()[^)]*(\\);[[:space:]]*)$|\\1$ARGUMENTS\\2|" "$FILE"
          done

          git diff --check -- "${PATHS[@]}"
          git add -- "${PATHS[@]}"

          if git diff --cached --quiet; then
            echo "All server versions are already $VERSION"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bump version: $VERSION"
          git push

      - name: Resolve build revision
        id: revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare, bump_version]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.bump_version.outputs.sha }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Resolve project
        id: project
        shell: bash
        run: |
          SERVER="${{ matrix.server }}"
          PROJECT="Source/$SERVER/$SERVER/$SERVER.csproj"
          if [ ! -f "$PROJECT" ]; then
            echo "::error::Project $PROJECT not found"
            exit 1
          fi
          ASSEMBLY=$(sed -n 's|.*<AssemblyName>\([^<]*\)</AssemblyName>.*|\1|p' "$PROJECT" | head -1)
          echo "path=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "assembly=$ASSEMBLY" >> "$GITHUB_OUTPUT"

      - name: Resolve platform
        id: platform
        shell: bash
        run: |
          case "${{ matrix.rid }}" in
            win-x86)   echo "value=x86" >> "$GITHUB_OUTPUT" ;;
            linux-x64) echo "value=x64" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Publish
        shell: bash
        run: |
          dotnet publish "${{ steps.project.outputs.path }}" \
            -c Release \
            -r ${{ matrix.rid }} \
            -p:Platform=${{ steps.platform.outputs.value }} \
            --self-contained \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=none \
            -o publish

      - name: Resolve version
        id: version
        shell: bash
        run: |
          ASSEMBLY="${{ steps.project.outputs.assembly }}"
          RID="${{ matrix.rid }}"
          if [[ "$RID" == win-* ]]; then
            EXE="publish/${ASSEMBLY}.exe"
          else
            EXE="publish/${ASSEMBLY}"
            chmod +x "$EXE"
          fi

          # Invoke VersionCommandTask (registered as subcommand "version") to
          # obtain the per-server Program.Version — not the release input tag.
          OUTPUT=$("$EXE" version)
          echo "$OUTPUT"

          VERSION=$(echo "$OUTPUT" | awk '$1 == "[v]" && $2 == "Version:" {print $3; exit}')
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to parse Version from '$EXE version' output"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify and package
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.path }}"
          PROJECT_DIR=$(dirname "$PROJECT")
          ASSEMBLY="${{ steps.project.outputs.assembly }}"
          RID="${{ matrix.rid }}"
          VERSION="${{ steps.version.outputs.value }}"

          # Determine executable name
          if [[ "$RID" == win-* ]]; then
            EXE="${ASSEMBLY}.exe"
          else
            EXE="${ASSEMBLY}"
          fi

          # Prepare staging directory
          mkdir -p staging

          # Copy executable from publish output
          if [ ! -f "publish/$EXE" ]; then
            echo "::error::Executable $EXE not found in publish output"
            ls -la publish/
            exit 1
          fi
          cp "publish/$EXE" staging/

          # Copy PreserveNewest content files if they exist
          PRESERVE_FILES=$(grep -B1 'PreserveNewest' "$PROJECT" | sed -n 's/.*Update="\([^"]*\)".*/\1/p' || true)
          for f in $PRESERVE_FILES; do
            if [ -f "$PROJECT_DIR/$f" ]; then
              cp "$PROJECT_DIR/$f" staging/
            fi
          done

          # Copy README.md
          if [ ! -f "README.md" ]; then
            echo "::error::README.md not found in repository root"
            exit 1
          fi
          cp README.md staging/

          echo "Package contents:"
          ls -1 staging

          # Create zip
          cd staging
          7z a -tzip "$GITHUB_WORKSPACE/${ASSEMBLY}-${RID}-${VERSION}.zip" .

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.project.outputs.assembly }}-${{ matrix.rid }}-${{ steps.version.outputs.value }}
          path: ${{ steps.project.outputs.assembly }}-${{ matrix.rid }}-${{ steps.version.outputs.value }}.zip

  release:
    needs: [build, bump_version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Check tag availability
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ inputs.tag }}"
          if gh api "repos/$GH_REPO/git/refs/tags/$TAG" --silent 2>/dev/null; then
            echo "::warning::Tag '$TAG' already exists. Consider deleting the existing tag or using a different tag name."
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ inputs.tag }}"
          gh release create "$TAG" \
            --draft \
            --title "Draft Release $TAG" \
            --target "${{ needs.bump_version.outputs.sha }}" \
            --generate-notes \
            artifacts/*.zip
